description:
  en: "A Red Sea resort town in Egypt's Sinai. People go for the beach hotels and for snorkelling and diving on the reefs at Ras Mohammed and Tiran."
  hy: "Կարմիր ծովի ափին գտնվող հանգստավայր Եգիպտոսի Սինայի թերակղզում։ Այստեղ գալիս են լողափնյա հյուրանոցների, ինչպես նաև Ռաս Մոհամեդի և Տիրանի խութերում սնորքլինգի ու դայվինգի համար։"
  ru: "Курорт на Красном море, на Синайском полуострове в Египте. Сюда едут ради пляжных отелей, снорклинга и дайвинга на рифах Рас-Мохаммеда и Тирана."
flight:
  en: "Direct flights from Zvartnots, some of them seasonal."
  hy: "Ուղիղ չվերթեր «Զվարթնոց»-ից, որոշները՝ սեզոնային։"
  ru: "Прямые рейсы из Звартноца, часть из них сезонные."
visa:
  en: "Armenian, Russian and Ukrainian passport holders get a visa on arrival at the airport."
  hy: "Հայաստանի, Ռուսաստանի և Ուկրաինայի անձնագրերով վիզան տրվում է օդանավակայանում՝ ժամանելիս։"
  ru: "Владельцам армянского, российского и украинского паспортов виза ставится по прилёте в аэропорту."
best_months:
