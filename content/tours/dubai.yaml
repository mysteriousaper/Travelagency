description:
  en: "Beach hotels on Jumeirah and Palm Jumeirah, big malls and the view from Burj Khalifa. A popular short trip in the cooler months."
  hy: "Լողափնյա հյուրանոցներ Ջումեյրայում և Փալմ Ջումեյրայում, մեծ առևտրի կենտրոններ և տեսարան Բուրջ Խալիֆայից։ Հարմար է կարճ ուղևորության համար զով ամիսներին։"
  ru: "Пляжные отели на Джумейре и Палм-Джумейре, большие торговые центры и вид с Бурдж-Халифы. Удобно для короткой поездки в прохладные месяцы."
flight:
  en: "Direct flights from Zvartnots, about 3 hours."
  hy: "Ուղիղ չվերթեր «Զվարթնոց»-ից, մոտ 3 ժամ։"
  ru: "Прямые рейсы из Звартноца, около 3 часов."
visa:
  en: "No visa needed for Armenian, Russian and Ukrainian passports. The passport must be valid for at least 6 months, counting the day of arrival."
  hy: "Վիզա պետք չէ Հայաստանի, Ռուսաստանի և Ուկրաինայի անձնագրերի համար։ Անձնագիրը պետք է վավեր լինի առնվազն 6 ամիս՝ ներառյալ ժամանման օրը։"
  ru: "Виза не нужна для армянского, российского и украинского паспортов. Паспорт должен действовать не менее 6 месяцев, включая день прибытия."
best_months:
  en: "November to March. Summers are very hot."
  hy: "Նոյեմբերից մարտ։ Ամռանը շատ շոգ է։"
  ru: "С ноября по март. Летом очень жарко."
